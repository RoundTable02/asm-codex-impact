services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: social_worker_ax
      POSTGRES_USER: social_worker_ax
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_worker_ax -d social_worker_ax"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
