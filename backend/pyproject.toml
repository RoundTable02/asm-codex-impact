[project]
name = "social-worker-ax-backend"
version = "0.1.0"
description = "Social-work consultation AX MVP backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "greenlet>=3.0,<4",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "openai>=1.50,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
